version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      # .npmrc の min-release-age=7 と揃える（version updates のみ。security は即時）
      default-days: 7
    groups:
      # react と react-dom は版が完全に一致しないと起動しないため、同じ PR で上げる
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
